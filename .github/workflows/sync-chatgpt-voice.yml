name: Sync ChatGPT Voice IP rules

on:
  schedule:
    # 04:17 Asia/Taipei, daily. GitHub schedules use UTC.
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'chatgpt-voice/**'
      - '.github/workflows/sync-chatgpt-voice.yml'
  pull_request:
    paths:
      - 'chatgpt-voice/**'
      - '.github/workflows/sync-chatgpt-voice.yml'

permissions:
  contents: read

concurrency:
  group: chatgpt-voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test feed validation and preservation of published rules
        run: python -m unittest discover -s chatgpt-voice -p 'test_*.py' -v
      - name: Check committed snapshot and generated rules
        run: python chatgpt-voice/update.py --check

  sync:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refresh official Voice IPs
        run: python chatgpt-voice/update.py
      - name: Verify generated files
        run: python chatgpt-voice/update.py --check
      - name: Commit changed rules only
        shell: bash
        run: |
          set -euo pipefail
          git add -- chatgpt-voice/ChatGPTVoice.list chatgpt-voice/source.json
          if git diff --cached --quiet; then
            echo 'Official Voice IP rules are unchanged.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: sync official ChatGPT Voice IP rules'
          # Rebase over concurrent edits; never force-push or overwrite other rules.
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
